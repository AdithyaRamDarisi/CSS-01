```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Product Card</title>
    <link rel="stylesheet" href="./indx.css">
</head>
<body>

    <h1 class="page-title">Featured Product</h1>

    <div class="product-card">

        <div class="product-image">
            <span class="product-badge">SALE</span>

            <img
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
                alt="Premium wireless headphones"
            >
        </div>

        <div class="product-details">

            <p class="product-category">PREMIUM AUDIO</p>

            <h2 class="product-name">Wireless Headphones</h2>

            <p class="product-description">
                Experience immersive sound with premium wireless
                headphones designed for comfort and style.
            </p>

            <div class="product-rating">
                <span class="rating-stars">★★★★★</span>
                <span class="rating-value">4.8</span>
                <span class="review-count">(124 reviews)</span>
            </div>

            <div class="product-pricing">
                <span class="current-price">₹2,499</span>
                <span class="original-price">₹3,999</span>
            </div>

            <button class="cart-button">
                <span>Add to Cart</span>
                <span class="cart-icon">→</span>
            </button>

        </div>

    </div>

</body>
</html>
